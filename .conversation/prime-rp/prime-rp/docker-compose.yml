services:
  postgres:
    image: postgres:17-alpine
    container_name: prime-rp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime
      POSTGRES_DB: prime_rp
    ports:
      - "5432:5432"
    volumes:
      - prime_rp_pgdata:/var/lib/postgresql/data

volumes:
  prime_rp_pgdata:
